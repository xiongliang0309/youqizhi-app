<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="description" content="幼启智：面向幼儿与家长的启蒙学习与亲子内容平台，涵盖语言、逻辑、科学、国学等模块。" />
    <title>幼启智</title>
    <script>
      // 卸载所有可能残留的 Service Worker
      if ('serviceWorker' in navigator) {
        navigator.serviceWorker.getRegistrations().then(function(registrations) {
          for(let registration of registrations) {
            registration.unregister();
          }
        }).catch(function(err) {
          console.error('Service Worker unregistration failed: ', err);
        });
      }

      window.addEventListener('error', function(e) {
        var errDiv = document.createElement('div');
        errDiv.style.cssText = 'position: fixed; top: 0; left: 0; right: 0; background: red; color: white; padding: 10px; z-index: 9999; word-break: break-all;';
        errDiv.textContent = 'Error: ' + (e.message || e.error);
        document.body.appendChild(errDiv);
      });
      window.addEventListener('unhandledrejection', function(e) {
        var errDiv = document.createElement('div');
        errDiv.style.cssText = 'position: fixed; top: 50px; left: 0; right: 0; background: orange; color: white; padding: 10px; z-index: 9999; word-break: break-all;';
        errDiv.textContent = 'Promise Error: ' + (e.reason && e.reason.message ? e.reason.message : String(e.reason));
        document.body.appendChild(errDiv);
      });
    </script>
    <style>
      body, html {
        font-family: system-ui, -apple-system, sans-serif;
        margin: 0;
        padding: 0;
        overflow: hidden;
        height: 100%;
        width: 100%;
        background-color: white; /* 强制背景为白色 */
      }
      #root {
        height: 100%;
        width: 100%;
      }
      #loading-indicator {
        position: absolute;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        font-size: 24px;
        color: #333;
        z-index: -1;
      }
    </style>
  </head>
  <body>
    <div id="loading-indicator">正在加载幼启智...</div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
